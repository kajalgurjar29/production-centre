# AppCentre — Nginx site config
#
# Serves:
#   /       -> AITransformation      (static build)
#   /admin  -> Blueprint Admin Panel (static build)
#   /api    -> Node backend (PM2, appcentre-api) on 127.0.0.1:4001
#
# Install:
#   sudo cp deploy/nginx-appcentre.conf /etc/nginx/sites-available/appcentre
#   sudo ln -s /etc/nginx/sites-available/appcentre /etc/nginx/sites-enabled/appcentre
#   sudo nginx -t && sudo systemctl reload nginx
#
# Update ROOT below to the absolute path of this project on the EC2 box.

server {
    listen 80;
    server_name _;

    # User panel is the site root, so `root` points straight at its folder.
    root /var/www/admin-panel-production/AITransformation; # <-- set to this project's absolute path on EC2
    index index.html;

    # --- API ---
    location /api {
        proxy_pass http://127.0.0.1:4001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Uploaded files (review photos, etc.) ---
    location /uploads/ {
        alias /var/www/admin-panel-production/backend/uploads/;
    }

    # --- Admin panel (multi-page static site) ---
    location = /admin {
        return 301 /admin/;
    }
    location /admin/ {
        alias "/var/www/admin-panel-production/Blueprint Admin Panel/";
        index index.html;
        try_files $uri $uri/ =404;
    }

    # --- User panel (multi-page static site, site root) ---
    location / {
        try_files $uri $uri/ =404;
    }
}
