# AppCentre — Nginx site config (production reference)
#
# This box serves MULTIPLE domains from one Nginx instance, each with its own
# server block. This file documents the aitransformationprofessionals.com
# block only — the mtghq.com block already exists in the live file and is not
# reproduced here, so merge this in rather than overwriting the live file.
#
# Live file on the server:
#   /etc/nginx/sites-available/appcentre  (symlinked from sites-enabled)
# Do NOT edit appcentre.before-duplicate-fix — that's a backup, not the active file.

server {
    server_name aitransformationprofessionals.com www.aitransformationprofessionals.com aitp.uk www.aitp.uk;

    # Serve uploaded files directly
    location /uploads/ {
        alias /var/repos/production-centre/backend/uploads/;
    }

    # Send application requests to Node
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_cache_bypass $http_upgrade;
    }

    listen 443 ssl;
    ssl_certificate     /etc/letsencrypt/live/aitransformationprofessionals.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aitransformationprofessionals.com/privkey.pem;
}

server {
    listen 80;
    server_name aitransformationprofessionals.com www.aitransformationprofessionals.com aitp.uk www.aitp.uk;
    return 301 https://$host$request_uri;
}
